# Grove configuration for PaulBujor/Marquee.
# Generated by repository discovery; edit freely. Templates: {{port.<service>}},
# {{db.<service>}}, {{redis.index}}, {{project}}, {{worktree}}, {{env}}.
# Machine-specific values belong in the local override file, not here.
version: 1
ports:
  base: 3100
  blockSize: 10
services:
  marquee:
    label: SvelteKit dev server (Vite, Cloudflare bindings emulated)
    dir: .
    start: pnpm exec vite dev --port {{port.marquee}} --strictPort
    install: pnpm install --frozen-lockfile
    migrate: pnpm db:migrate:local
    resetDb: rm -rf .wrangler/state/v3/d1 && pnpm db:migrate:local
    resetCache: rm -rf .svelte-kit
    port:
      var: PORT
      offset: 0
    custom:
      - name: Typecheck
        cmd: pnpm check
        enabled: true
        description: wrangler types + svelte-kit sync + svelte-check + service-worker tsc (run on a clean tree)
        group: App
      - name: Lint
        cmd: pnpm lint
        enabled: true
        description: Prettier check + ESLint
        group: App
      - name: Lint (fix)
        cmd: pnpm exec eslint . --fix
        enabled: true
        description: ESLint with autofix
        group: App
      - name: Prettier (changed files)
        cmd: git diff --name-only --diff-filter=ACMR --relative HEAD | xargs -r pnpm exec prettier --write --ignore-unknown
        enabled: true
        description: Format only files changed against HEAD
        group: App
      - name: Run all tests
        cmd: pnpm test
        enabled: true
        description: svelte-kit sync + vitest run (unit tests, in-memory SQLite with real migrations)
        group: App
      - name: Test (watch)
        cmd: pnpm test:watch
        enabled: false
        description: Vitest in watch mode
        group: App
      - name: Test with coverage
        cmd: pnpm test:coverage
        enabled: false
        description: Vitest run with v8 coverage (what CI publishes)
        group: App
      - name: Coverage summary
        cmd: node scripts/coverage-summary.mjs
        enabled: false
        description: Print the coverage/ summary table
        group: App
      - name: Build
        cmd: pnpm build
        enabled: false
        description: wrangler types + vite build + append scheduled/queue handlers
        group: App
      - name: Preview built worker
        cmd: pnpm preview
        enabled: false
        description: Run the built worker locally in workerd (wrangler dev)
        group: App
      - name: Regenerate worker types
        cmd: pnpm gen
        enabled: true
        description: wrangler types — run once after cloning so the editor has Env/platform types
        group: App
      - name: Apply local D1 migrations
        cmd: pnpm db:migrate:local
        enabled: true
        description: wrangler d1 migrations apply marquee --local
        group: Database
      - name: Reset local D1 + migrate
        cmd: rm -rf .wrangler/state/v3/d1 && pnpm db:migrate:local
        enabled: true
        description: Drop the local emulated D1 and re-apply all migrations
        group: Database
      - name: Generate migration
        cmd: pnpm db:generate --name <descriptive_snake_case>
        enabled: false
        description: Drizzle-kit generate migration SQL from schema.ts (always pass --name)
        group: Database
      - name: Drizzle Studio
        cmd: pnpm db:studio
        enabled: false
        description: Browse the generated SQLite schema in Drizzle Studio
        group: Database
      - name: Regenerate icons
        cmd: pnpm gen:icons
        enabled: false
        description: Rebuild PWA icons/splash/favicons from dev-assets/ sources
        group: Project
      - name: CI gate (lint → check → build → test)
        cmd: pnpm lint && pnpm check && pnpm build && pnpm test
        enabled: false
        description: The full local gate mirroring .github/workflows/ci.yml
        group: Project
  mailpit:
    kind: shared
    label: Mailpit (local SMTP + web UI)
    start: docker compose -f docker-compose.yml up -d mailpit
    stop: docker compose -f docker-compose.yml stop mailpit
    version: latest
    isolate: none
env:
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  EMAIL_FROM: Marquee <dev@marquee.local>
commands:
  - name: Start Mailpit
    cmd: docker compose -f docker-compose.yml up -d mailpit
    enabled: false
    description: Local SMTP on :1025, web UI on http://localhost:8025
    group: Infrastructure
  - name: Stop Mailpit
    cmd: docker compose -f docker-compose.yml stop mailpit
    enabled: false
    description: Stop the local mail catcher
    group: Infrastructure
  - name: Create .dev.vars
    cmd: test -f .dev.vars || cp .dev.vars.example .dev.vars
    enabled: false
    description: Seed local secrets/dev vars (TMDB, VAPID, Mailpit SMTP) from the example
    group: Project
  - name: Deploy (prod)
    cmd: pnpm deploy
    enabled: false
    remote: true
    description: Apply migrations to the remote D1 and wrangler deploy
    group: Project
  - name: Deploy (preview)
    cmd: pnpm deploy:preview
    enabled: false
    remote: true
    description: Apply migrations to the preview D1 and deploy the preview environment
    group: Project
  - name: Apply remote D1 migrations
    cmd: pnpm db:migrate:remote
    enabled: false
    remote: true
    description: wrangler d1 migrations apply marquee --remote (deployed database)
    group: Project
openTargets:
  - id: app
    label: App
    kind: url
    url: http://localhost:{{port.marquee}}
  - id: admin
    label: Admin
    kind: url
    url: http://localhost:{{port.marquee}}/admin
  - id: healthz
    label: Health check
    kind: url
    url: http://localhost:{{port.marquee}}/healthz
  - id: mailpit
    label: Mailpit
    kind: url
    url: http://localhost:8025
shared:
  mailpit:
    label: mailpit
    compose:
      file: docker-compose.yml
      service: mailpit
    port: 1025
    health:
      type: port
      port: 1025

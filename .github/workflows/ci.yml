name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One job per workspace package so neither can block the other's release.
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Root scripts delegate to `pnpm --filter @marquee/web …`.
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test:coverage
      - name: Publish coverage summary
        if: always()
        working-directory: apps/web
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          # Resolved from the repo root, not from `working-directory`.
          path: apps/web/coverage/
          if-no-files-found: ignore

  # The bridge deploys on its own, so it gates on its own job: a required check
  # on `main`, so a broken bridge blocks the bridge and nothing else.
  stremio-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No coverage here: the bridge is small, and `test` is the gate.
      - run: pnpm run lint:stremio-bridge
      - run: pnpm run check:stremio-bridge
      - run: pnpm run build:stremio-bridge
      - run: pnpm run test:stremio-bridge
